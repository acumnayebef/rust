name: Build iOS Launcher (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust & iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build MCRustCore.xcframework
        run: |
          chmod +x rust-core/scripts/build-xcframework.sh
          ./rust-core/scripts/build-xcframework.sh

      - name: Generate Xcode project
        run: |
          cd ios-app
          xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios-app/MCRustLauncher.xcodeproj \
            -scheme MCRustLauncher \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/MCRustLauncher.app dist/Payload/
          cd dist
          zip -r ../MCRustLauncher-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCRustLauncher-unsigned-ipa
          path: MCRustLauncher-unsigned.ipa
          if-no-files-found: error
